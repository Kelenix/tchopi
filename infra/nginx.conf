# Tchopi — API (Supabase) : site nginx de l'hôte, installé par infra/server.sh dans /etc/nginx/sites-available/ ;
# certbot y ajoute ensuite HTTPS (443) et la redirection HTTP → HTTPS. La passerelle n'écoute que sur 127.0.0.1.
map $http_upgrade $tchopi_connection {
  default upgrade;
  '' '';
}

server {
  server_name __DOMAIN__;
  server_tokens off;
  client_max_body_size 10m;

  # Seule l'API est publique ; Studio passe par le tunnel SSH (vps.ps1 studio).
  location ~ ^/(auth|rest|realtime|storage|functions|graphql)/v1(/|$) {
    proxy_pass http://127.0.0.1:8010;
    proxy_http_version 1.1;
    # Temps réel (websocket) ; fonctions serveur jusqu'à 150 s.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $tchopi_connection;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 160s;
  }

  include snippets/tchopi-routing.conf;

  location / {
    return 404;
  }

  listen 80;
  listen [::]:80;
}
