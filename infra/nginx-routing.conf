# Tchopi — trajets routiers des cartes (OSRM, ADR-038), inclus dans le site de l'API (infra/nginx.conf) ; copié par
# infra/server.sh dans /etc/nginx/snippets/. Seul l'itinéraire en voiture entre deux points est public.
location ~ "^/route/v1/driving/-?[0-9.]+,-?[0-9.]+;-?[0-9.]+,-?[0-9.]+$" {
  proxy_pass http://127.0.0.1:5010;
  proxy_set_header Host $host;
  proxy_read_timeout 10s;
}
